<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amposer Overdrive</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, #232323 0%, #0a0a0a 70%),
      #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
    user-select: none;
  }

  /* ============ БОКОВЫЕ ПАНЕЛИ ============ */
  .input-panel, .rec-panel {
    position: fixed;
    top: 18px;
    width: 250px;
    background: linear-gradient(180deg, #1c1c1c, #101010);
    border: 2px solid #c9a227;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.85), inset 0 0 20px rgba(0,0,0,.6);
    z-index: 100;
  }
  .input-panel { left: 18px; }
  .rec-panel { right: 18px; text-align: center; }

  .ip-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: #c9a227;
    font-weight: 700;
    margin-bottom: 10px;
    text-align: center;
  }
  .input-panel select {
    width: 100%;
    padding: 8px 6px;
    background: #0b0b0b;
    color: #e8dcc0;
    border: 1px solid #3a3a3a;
    border-radius: 5px;
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  .input-panel select:focus { border-color: #c9a227; }

  .ip-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .ip-row button {
    flex: 1;
    padding: 9px 6px;
    border-radius: 5px;
    border: 1px solid #3a3a3a;
    background: linear-gradient(180deg, #2a2a2a, #171717);
    color: #ddd;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .15s;
  }
  .ip-row button:hover { background: linear-gradient(180deg, #383838, #202020); }
  .ip-row button#refreshBtn { flex: 0 0 42px; font-size: 15px; }

  .ip-row button.power {
    background: linear-gradient(180deg, #3a1010, #200808);
    border-color: #6b1a1a;
    color: #ff8a8a;
  }
  .ip-row button.power.on {
    background: linear-gradient(180deg, #0f3a15, #08200a);
    border-color: #1f7a2c;
    color: #7dff9a;
    box-shadow: 0 0 14px rgba(60,255,110,.35);
  }

  .ip-status {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #888;
    justify-content: center;
  }
  .led {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #400;
    box-shadow: inset 0 0 3px #000;
    transition: .2s;
  }
  .led.on {
    background: #39ff6a;
    box-shadow: 0 0 10px #39ff6a, inset 0 0 3px #fff;
  }
  .led.rec {
    background: #ff2020;
    box-shadow: 0 0 10px #ff2020, inset 0 0 3px #fff;
  }

  /* ============ REC КНОПКА (компактная, плоская) ============ */
  .rec-btn-wrap {
    margin: 6px 0 4px;
    display: flex;
    justify-content: center;
  }
  .rec-btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(180deg, #d82020, #9a0c0c);
    border: 2px solid #500000;
    box-shadow: 0 2px 5px rgba(0,0,0,.55);
    color: #fff;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: background .15s, transform .1s, box-shadow .15s;
    text-shadow: 0 1px 1px rgba(0,0,0,.5);
  }
  .rec-btn:hover {
    background: linear-gradient(180deg, #ec3030, #b01414);
    box-shadow: 0 2px 10px rgba(255,0,0,.35);
  }
  .rec-btn:active { transform: scale(.95); }
  .rec-btn.recording {
    background: linear-gradient(180deg, #ff2a2a, #cc0000);
    animation: recPulse 1.1s infinite;
  }
  @keyframes recPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(255,0,0,0); }
    50%      { box-shadow: 0 0 16px rgba(255,0,0,.85); }
  }

  .rec-time {
    font-family: 'Courier New', monospace;
    font-size: 22px;
    color: #ff6b6b;
    letter-spacing: 3px;
    font-weight: 700;
    margin: 6px 0 4px;
    text-shadow: 0 0 8px rgba(255,60,60,.4);
  }
  .rec-folder {
    font-size: 10px;
    color: #999;
    margin: 8px 0;
    word-break: break-all;
    line-height: 1.35;
    min-height: 26px;
    padding: 4px 6px;
    background: #0a0a0a;
    border-radius: 4px;
    border: 1px solid #222;
  }
  .rec-folder.has { color: #e8dcc0; }

  /* ============ КОМБИК ============ */
  .amp {
    width: 780px;
    max-width: 100%;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #1c1c1c, #070707);
    border: 4px solid #b8962a;
    border-radius: 12px;
    padding: 12px;
    box-shadow:
      0 30px 70px rgba(0,0,0,.9),
      inset 0 0 60px rgba(0,0,0,.9),
      0 0 0 1px #000;
  }

  .amp-panel {
    background: linear-gradient(180deg, #ece0c0 0%, #ddcda2 45%, #c3b183 100%);
    border-radius: 6px;
    border: 1px solid #8a7a4a;
    padding: 14px 18px 16px;
    box-shadow: inset 0 2px 4px rgba(255,255,255,.6), inset 0 -3px 8px rgba(0,0,0,.25);
    color: #1a1a1a;
  }

  .panel-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid rgba(0,0,0,.25);
  }
  .brand {
    font-family: 'Brush Script MT', 'Segoe Script', cursive;
    font-size: 30px;
    color: #111;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .brand small {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 4px;
    font-weight: 700;
    color: #5a4d2a;
    display: block;
    margin-top: -2px;
  }
  .model {
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #5a4d2a;
  }

  .panel-body {
    display: flex;
    gap: 14px;
    align-items: stretch;
    flex-wrap: wrap;
  }

  .module {
    background: linear-gradient(180deg, #141414, #050505);
    border-radius: 6px;
    padding: 10px 12px 12px;
    border: 1px solid #000;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 3px 8px rgba(0,0,0,.4);
    min-width: 190px;
  }
  .module-title {
    font-size: 9px;
    letter-spacing: 2.5px;
    color: #c9a227;
    font-weight: 700;
    margin-bottom: 9px;
    text-align: center;
  }
  .btn-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-row button {
    padding: 8px 11px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 4px;
    border: 1px solid #333;
    background: linear-gradient(180deg, #262626, #131313);
    color: #8a8a8a;
    cursor: pointer;
    transition: .15s;
    box-shadow: 0 2px 0 #000;
  }
  .btn-row button:hover { color: #ccc; background: linear-gradient(180deg, #333, #1a1a1a); }
  .btn-row button.active {
    background: linear-gradient(180deg, #e8c84a, #b8962a);
    color: #1a1400;
    border-color: #7a6418;
    box-shadow: 0 0 12px rgba(230,190,60,.6), 0 2px 0 #6b5714;
  }

  .knob-zone {
    background: linear-gradient(180deg, #141414, #050505);
    border-radius: 6px;
    padding: 12px 14px 10px;
    border: 1px solid #000;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 3px 8px rgba(0,0,0,.4);
    display: flex;
    gap: 14px;
    align-items: flex-start;
    flex: 1;
    justify-content: center;
    flex-wrap: wrap;
  }
  .knob-group { display: flex; gap: 14px; }
  .knob-divider {
    width: 1px;
    align-self: stretch;
    background: linear-gradient(180deg, transparent, #444, transparent);
    margin: 4px 2px;
  }

  .knob {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: ns-resize;
    touch-action: none;
  }
  .knob-dial {
    width: 54px; height: 54px;
    border-radius: 50%;
    position: relative;
    background:
      radial-gradient(circle at 34% 28%, #6a6a6a 0%, #2a2a2a 42%, #0a0a0a 100%);
    border: 2px solid #000;
    box-shadow:
      0 4px 8px rgba(0,0,0,.75),
      inset 0 2px 3px rgba(255,255,255,.22),
      inset 0 -3px 6px rgba(0,0,0,.8);
    transition: box-shadow .15s;
  }
  .knob:hover .knob-dial { box-shadow: 0 4px 12px rgba(0,0,0,.85), 0 0 12px rgba(200,160,40,.35), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.8); }
  .knob.active .knob-dial { box-shadow: 0 0 18px rgba(230,190,60,.7), inset 0 2px 3px rgba(255,255,255,.3), inset 0 -3px 6px rgba(0,0,0,.8); }

  .knob-pointer {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    transform: rotate(-135deg);
    pointer-events: none;
  }
  .knob-pointer::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 5px;
    width: 3px;
    height: 17px;
    margin-left: -1.5px;
    background: linear-gradient(180deg, #fff, #b8b8b8);
    border-radius: 2px;
    box-shadow: 0 0 5px rgba(255,255,255,.7);
  }
  .knob-name {
    font-size: 9px;
    letter-spacing: 1.5px;
    font-weight: 700;
    color: #c9a227;
  }

  .amp-grille {
    margin-top: 12px;
    height: 200px;
    border-radius: 6px;
    border: 1px solid #000;
    background:
      repeating-linear-gradient(0deg, #1c1712 0 2px, #0d0a08 2px 4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px),
      #100d0b;
    box-shadow: inset 0 0 50px rgba(0,0,0,.95);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .logo-plate {
    background: linear-gradient(180deg, #f0e6c8, #cdbb8c);
    border: 2px solid #8a7a4a;
    border-radius: 4px;
    padding: 8px 30px;
    font-family: 'Brush Script MT', 'Segoe Script', cursive;
    font-size: 34px;
    color: #111;
    box-shadow: 0 4px 14px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.9);
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }

  .hint {
    text-align: center;
    font-size: 10px;
    color: #6a6a6a;
    letter-spacing: 1px;
    margin-top: 10px;
  }

  @media (max-width: 1300px) {
    .input-panel, .rec-panel { position: static; width: 100%; max-width: 780px; }
    .input-panel { margin-bottom: 16px; }
    .rec-panel { margin-top: 16px; }
    body { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ===== ЛЕВАЯ ПАНЕЛЬ: ВХОД ===== -->
<div class="input-panel">
  <div class="ip-title">INPUT SOURCE / АУДИОВХОД</div>
  <select id="deviceSelect"></select>
  <div class="ip-row">
    <button id="refreshBtn" title="Обновить список устройств">⟳</button>
    <button id="powerBtn" class="power">POWER ON</button>
  </div>
  <div class="ip-status">
    <span class="led" id="led"></span>
    <span id="statusText">ВЫКЛЮЧЕН</span>
  </div>
</div>

<!-- ===== ПРАВАЯ ПАНЕЛЬ: ЗАПИСЬ ===== -->
<div class="rec-panel">
  <div class="ip-title">RECORDING</div>
  <div class="rec-btn-wrap">
    <button id="recBtn" class="rec-btn">REC</button>
  </div>
  <div class="rec-time" id="recTime">00:00</div>
  <div class="rec-folder" id="recFolder">Папка не выбрана</div>
  <div class="ip-row">
    <button id="folderBtn">📁 ВЫБРАТЬ ПАПКУ</button>
  </div>
  <div class="ip-status">
    <span class="led" id="recLed"></span>
    <span id="recStatus">ГОТОВ</span>
  </div>
</div>

<!-- ===== КОМБИК ===== -->
<div class="amp">
  <div class="amp-panel">
    <div class="panel-top">
      <div class="brand">Amposer<small>STYLE OVERDRIVE</small></div>
      <div class="model">JCM-900 · SIM</div>
    </div>

    <div class="panel-body">
      <div class="module">
        <div class="module-title">OVERDRIVE</div>
        <div class="btn-row" id="modeRow">
          <button data-mode="clean">CLEAN</button>
          <button data-mode="crunch" class="active">CRUNCH</button>
          <button data-mode="lead">LEAD</button>
        </div>
      </div>

      <div class="module">
        <div class="module-title">CABINET SIM</div>
        <div class="btn-row" id="cabRow">
          <button data-cab="off">OFF</button>
          <button data-cab="1x12">1×12</button>
          <button data-cab="2x12">2×12</button>
          <button data-cab="4x12" class="active">4×12</button>
        </div>
      </div>

      <div class="knob-zone">
        <div class="knob-group">
          <div class="knob" data-param="gain">
            <div class="knob-dial"><div class="knob-pointer"></div></div>
            <div class="knob-name">GAIN</div>
          </div>
          <div class="knob" data-param="volume">
            <div class="knob-dial"><div class="knob-pointer"></div></div>
            <div class="knob-name">VOLUME</div>
          </div>
        </div>
        <div class="knob-divider"></div>
        <div class="knob-group">
          <div class="knob" data-param="low">
            <div class="knob-dial"><div class="knob-pointer"></div></div>
            <div class="knob-name">LOW</div>
          </div>
          <div class="knob" data-param="mid">
            <div class="knob-dial"><div class="knob-pointer"></div></div>
            <div class="knob-name">MID</div>
          </div>
          <div class="knob" data-param="high">
            <div class="knob-dial"><div class="knob-pointer"></div></div>
            <div class="knob-name">HIGH</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="amp-grille">
    <div class="logo-plate">Amposer</div>
  </div>

  <div class="hint">Крутилки: тяни вверх/вниз мышью · Shift — точная настройка · двойной клик — сброс</div>
</div>

<script>
/* =====================================================
   СОСТОЯНИЕ
   ===================================================== */
const params = { gain: 0.5, volume: 0.5, low: 0.5, mid: 0.5, high: 0.5 };
let currentMode = 'crunch';
let currentCab  = '4x12';

let audioCtx = null;
let stream = null;
let srcNode = null;
let chain = {};
let isOn = false;

/* Запись */
let directoryHandle = null;
let isRecording = false;
let captureNode = null;
let captureGain = null;
let capturedChunks = [];
let recStartMs = 0;
let recTimerInt = null;
let recModeSnapshot = '';
let recCabSnapshot = '';
let downloadCounter = 0;

const deviceSelect = document.getElementById('deviceSelect');
const powerBtn     = document.getElementById('powerBtn');
const refreshBtn   = document.getElementById('refreshBtn');
const ledEl        = document.getElementById('led');
const statusText   = document.getElementById('statusText');

const recBtn     = document.getElementById('recBtn');
const recTimeEl  = document.getElementById('recTime');
const recFolder  = document.getElementById('recFolder');
const recStatus  = document.getElementById('recStatus');
const recLed     = document.getElementById('recLed');
const folderBtn  = document.getElementById('folderBtn');

/* =====================================================
   УТИЛИТЫ
   ===================================================== */
function makeCurve(mode) {
  const n = 4096;
  const curve = new Float32Array(n);
  const k    = mode === 'clean' ? 1.2 : mode === 'crunch' ? 4.5 : 11;
  const asym = mode === 'lead' ? 0.30 : mode === 'crunch' ? 0.15 : 0.05;
  const norm = Math.tanh(k);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    let y = (1 - asym) * Math.tanh(k * x) + asym * Math.tanh(k * x * 2.6);
    curve[i] = y / norm;
  }
  return curve;
}

const CAB_PRESETS = {
  off:    { hp: 20,  lp1: 20000, lp2: 20000, peak: 0,   peakF: 120, dip: 0,    dipF: 700 },
  '1x12': { hp: 105, lp1: 5200,  lp2: 6200,  peak: 3,   peakF: 155, dip: -2,   dipF: 720 },
  '2x12': { hp: 92,  lp1: 5600,  lp2: 6600,  peak: 4,   peakF: 132, dip: -2.5, dipF: 660 },
  '4x12': { hp: 80,  lp1: 4500,  lp2: 5300,  peak: 5,   peakF: 110, dip: -3,   dipF: 600 }
};

/* =====================================================
   IDB для хранения handle папки
   ===================================================== */
function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('amposer', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readonly');
    const req = tx.objectStore('kv').get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

/* =====================================================
   АУДИОЦЕПЬ
   ===================================================== */
function buildChain() {
  const ctx = audioCtx;

  chain.inputGain = ctx.createGain();
  chain.shaper    = ctx.createWaveShaper();
  chain.shaper.oversample = '4x';
  chain.postGain  = ctx.createGain();

  chain.low  = ctx.createBiquadFilter();
  chain.mid  = ctx.createBiquadFilter();
  chain.high = ctx.createBiquadFilter();

  chain.cabHP   = ctx.createBiquadFilter();
  chain.cabLP1  = ctx.createBiquadFilter();
  chain.cabLP2  = ctx.createBiquadFilter();
  chain.cabPeak = ctx.createBiquadFilter();
  chain.cabDip  = ctx.createBiquadFilter();

  chain.volume  = ctx.createGain();

  chain.limiter = ctx.createDynamicsCompressor();
  chain.limiter.threshold.value = -3;
  chain.limiter.knee.value      = 0;
  chain.limiter.ratio.value     = 20;
  chain.limiter.attack.value    = 0.003;
  chain.limiter.release.value   = 0.1;

  chain.stereoOut = ctx.createGain();
  chain.stereoOut.channelCount = 2;
  chain.stereoOut.channelCountMode = 'explicit';
  chain.stereoOut.channelInterpretation = 'speakers';

  chain.low.type  = 'lowshelf';
  chain.low.frequency.value = 120;
  chain.mid.type  = 'peaking';
  chain.mid.frequency.value = 750;
  chain.mid.Q.value = 0.8;
  chain.high.type = 'highshelf';
  chain.high.frequency.value = 3200;

  chain.cabHP.type   = 'highpass';
  chain.cabHP.Q.value = 0.7;
  chain.cabLP1.type  = 'lowpass';
  chain.cabLP1.Q.value = 0.6;
  chain.cabLP2.type  = 'lowpass';
  chain.cabLP2.Q.value = 0.6;
  chain.cabPeak.type = 'peaking';
  chain.cabPeak.Q.value = 1.1;
  chain.cabDip.type  = 'peaking';
  chain.cabDip.Q.value = 0.9;

  chain.shaper.curve = makeCurve(currentMode);

  chain.inputGain.connect(chain.shaper);
  chain.shaper.connect(chain.postGain);
  chain.postGain.connect(chain.low);
  chain.low.connect(chain.mid);
  chain.mid.connect(chain.high);
  chain.high.connect(chain.cabHP);
  chain.cabHP.connect(chain.cabLP1);
  chain.cabLP1.connect(chain.cabLP2);
  chain.cabLP2.connect(chain.cabPeak);
  chain.cabPeak.connect(chain.cabDip);
  chain.cabDip.connect(chain.volume);
  chain.volume.connect(chain.limiter);
  chain.limiter.connect(chain.stereoOut);
  chain.stereoOut.connect(ctx.destination);

  applyParams();
  applyCab();
}

function applyParams() {
  if (!audioCtx || !chain.inputGain) return;
  const t = audioCtx.currentTime;
  const S = 0.02;
  const pre = 0.4 + Math.pow(params.gain, 1.6) * 14;
  chain.inputGain.gain.setTargetAtTime(pre, t, S);
  chain.postGain.gain.setTargetAtTime(Math.pow(pre, -0.4) * 1.45, t, S);
  chain.low.gain.setTargetAtTime((params.low  - 0.5) * 30, t, S);
  chain.mid.gain.setTargetAtTime((params.mid  - 0.5) * 30, t, S);
  chain.high.gain.setTargetAtTime((params.high - 0.5) * 30, t, S);
  chain.volume.gain.setTargetAtTime(Math.pow(params.volume, 1.8) * 2.0, t, S);
}

function applyCab() {
  if (!audioCtx || !chain.cabHP) return;
